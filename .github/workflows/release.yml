name: Release

# Tags and publishes a GitHub release whenever the canonical version in
# .claude-plugin/plugin.json changes on main (i.e. when a release PR merges).
# This removes the manual "tag the merge commit and create the release" step.
#
# Tags and releases created with GITHUB_TOKEN do not trigger other workflows, so
# publish-mcp.yml is started explicitly with workflow_dispatch at the end.

on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the release
  actions: write # dispatch publish-mcp.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that all version fields match
        if: steps.exists.outputs.skip == 'false'
        run: node scripts/check-versions.js

      - name: Create the tag and release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Generate notes against the previous *published* release, so versions that
          # were merged but never released are still covered.
          previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}"
          {
            echo "### Released $TAG"
            echo
            echo "Release notes were auto-generated. Edit them with \`gh release edit $TAG\` if they need a user-facing summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the MCP registry publish
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The job waits for approval in the mcp-registry-publish environment.
          gh workflow run publish-mcp.yml --ref "$TAG"
