[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glob-name-migrator"
version = "0.1.0a0"
description = "Migrate global request naming rules off Phase-3 deprecated conditions (alpha)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
glob-name-migrator = "glob_name_migrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glob_name_migrator"]

[tool.pylint.design]
max-args = 12
max-positional-arguments = 8
max-locals = 30
max-branches = 25
max-statements = 60
max-returns = 14
max-nested-blocks = 7
max-attributes = 15

[tool.pylint.format]
max-line-length = 130

[tool.pylint.messages_control]
disable = ["duplicate-code"]
