[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdr-migrator"
version = "0.1.0a0"
description = "Migrate classic service detection rules off Phase-3 deprecated conditions."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pylint>=4.0",
  "pyright>=1.1",
  "vulture>=2.16",
]

[project.scripts]
sdr-migrator = "sdr_migrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr_migrator"]

[tool.pylint.messages_control]
disable = [
  "C0114",  # missing-module-docstring — project policy: no docstrings
  "C0115",  # missing-class-docstring
  "C0116",  # missing-function-docstring
  "R0903",  # too-few-public-methods — intentional for exception subclasses
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 6
