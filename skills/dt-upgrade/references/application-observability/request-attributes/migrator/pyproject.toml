[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ra-migrator"
version = "0.1.0a0"
description = "Rework request attributes off Phase 3 deprecated conditions."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pylint>=3.2",
  "pyright>=1.1",
  "vulture>=2.11",
]

[project.scripts]
ra-migrator = "ra_migrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_migrator"]

[tool.pylint.messages_control]
disable = [
  "C0114",  # missing-module-docstring
  "C0115",  # missing-class-docstring
  "C0116",  # missing-function-docstring
  "R0903",  # too-few-public-methods - intentional for exception subclasses
]

[tool.pylint.format]
max-line-length = 110

[tool.pylint.design]
max-args = 8
# The classification values are frozen records rather than objects with state: a request
# attribute's bucket, its reasons and why it could not be read are all one answer about one
# configuration, and splitting them to reach seven would hide that.
max-attributes = 8
